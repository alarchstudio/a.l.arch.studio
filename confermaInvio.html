<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Grazie per il tuo messaggio | a.l.arch.studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            border: 1px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 35px;
        }

        .success-icon i {
            color: #ffffff;
            font-size: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            color: #a0a0a0;
            margin-bottom: 35px;
            line-height: 1.8;
            font-size: 14px;
        }

        .back-btn {
            display: inline-block;
            padding: 14px 40px;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            border: 1px solid #ffffff;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .back-btn:hover {
            background-color: #000000;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Messaggio inviato</h1>
        <p>Grazie per averci contattato. Riceverai una risposta il prima possibile.<br>Nel frattempo, puoi tornare alla home page.</p>
        <a href="index.html" class="back-btn">Torna alla Home</a>
    </div>
</body>
</html>
